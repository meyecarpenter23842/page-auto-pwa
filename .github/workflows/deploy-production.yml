name: Deploy production

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deploy-production' &&
      github.event.issue.number == 1 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: page-auto-pwa-production
      cancel-in-progress: false
    env:
      VERCEL_TEAM_ID: team_964e6EsImAKgZe01NQmUNF7F
      VERCEL_PROJECT_NAME: page-auto-pwa
      PRODUCTION_URL: https://page-auto-pwa.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact main SHA
        id: exact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require green CI at exact SHA
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.EXACT_SHA,
              event: 'push',
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              run => run.status === 'completed' && run.conclusion === 'success',
            );
            if (!passed) core.setFailed(`No green ci.yml push run for ${process.env.EXACT_SHA}`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Resolve exact Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")"
          if [ "$status" != "200" ]; then
            echo "Vercel project lookup failed with HTTP $status" >&2
            cat "$response_file" >&2
            exit 1
          fi

          project_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.id||'')" "$response_file")"
          project_name="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.name||'')" "$response_file")"
          account_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.accountId||'')" "$response_file")"
          rm -f "$response_file"

          test -n "$project_id"
          test "$project_name" = "$VERCEL_PROJECT_NAME"
          test "$account_id" = "$VERCEL_TEAM_ID"

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$project_id" > .vercel/project.json
          echo "Linked exact Vercel project: $project_name ($project_id)"

      - name: Deploy source to production with remote Vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify production relay Runtime Cache
        shell: bash
        run: |
          set -euo pipefail
          probe_file="$(mktemp)"
          trap 'rm -f "$probe_file"' EXIT
          dummy_token='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          dummy_device='00000000000000000000000000000000'

          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error \
              --output "$probe_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $dummy_token" \
              --header "X-Page-Auto-Device-Id: $dummy_device" \
              "$PRODUCTION_URL/api/relay/snapshot")"

            if [ "$status" = "401" ] || [ "$status" = "404" ]; then
              echo "Relay Runtime Cache probe passed with HTTP $status."
              exit 0
            fi

            echo "Relay Runtime Cache probe attempt $attempt returned HTTP $status; waiting for production alias propagation."
            sleep 5
          done

          echo "Relay Runtime Cache production probe failed." >&2
          cat "$probe_file" >&2 || true
          exit 1
