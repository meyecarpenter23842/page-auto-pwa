name: Deploy production

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deploy-production' &&
      github.event.issue.number == 1 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: page-auto-pwa-production
      cancel-in-progress: false
    env:
      VERCEL_TEAM_ID: team_964e6EsImAKgZe01NQmUNF7F
      VERCEL_PROJECT_NAME: page-auto-pwa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact main SHA
        id: exact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require green CI at exact SHA
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.EXACT_SHA,
              event: 'push',
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              run => run.status === 'completed' && run.conclusion === 'success',
            );
            if (!passed) core.setFailed(`No green ci.yml push run for ${process.env.EXACT_SHA}`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Resolve exact Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")"
          if [ "$status" != "200" ]; then
            echo "Vercel project lookup failed with HTTP $status" >&2
            cat "$response_file" >&2
            exit 1
          fi

          project_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.id||'')" "$response_file")"
          project_name="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.name||'')" "$response_file")"
          account_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.accountId||'')" "$response_file")"
          rm -f "$response_file"

          test -n "$project_id"
          test "$project_name" = "$VERCEL_PROJECT_NAME"
          test "$account_id" = "$VERCEL_TEAM_ID"

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$project_id" > .vercel/project.json
          echo "Linked exact Vercel project: $project_name ($project_id)"

      - name: Configure and verify Upstash Redis relay
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          connect_log="$(mktemp)"
          cleanup() { rm -f "$env_file" "$connect_log"; }
          trap cleanup EXIT

          pull_production_env() {
            rm -f "$env_file"
            vercel env pull "$env_file" --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null
          }

          has_redis_env() {
            if grep -q '^UPSTASH_REDIS_REST_URL=' "$env_file" && grep -q '^UPSTASH_REDIS_REST_TOKEN=' "$env_file"; then return 0; fi
            if grep -q '^KV_REST_API_URL=' "$env_file" && grep -q '^KV_REST_API_TOKEN=' "$env_file"; then return 0; fi
            return 1
          }

          pull_production_env
          if ! has_redis_env; then
            echo "Redis env is missing; trying to reconnect existing page-auto-pwa-relay resource."
            set +e
            vercel integration resource connect page-auto-pwa-relay "$VERCEL_PROJECT_NAME" \
              --environment production --yes --token="$VERCEL_TOKEN" >"$connect_log" 2>&1
            connect_status=$?
            set -e
            if [ "$connect_status" -ne 0 ]; then
              echo "No reusable page-auto-pwa-relay resource was connected; a free Upstash resource will be provisioned."
            fi
            pull_production_env
          fi

          if ! has_redis_env; then
            vercel integration add upstash \
              --name page-auto-pwa-relay \
              --plan free \
              --environment production \
              --yes \
              --token="$VERCEL_TOKEN"
            pull_production_env
          fi

          if ! has_redis_env; then
            echo "Upstash Redis integration did not provide the required production environment variables." >&2
            exit 1
          fi

          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          redis_url="${UPSTASH_REDIS_REST_URL:-${KV_REST_API_URL:-}}"
          redis_token="${UPSTASH_REDIS_REST_TOKEN:-${KV_REST_API_TOKEN:-}}"
          test -n "$redis_url"
          test -n "$redis_token"

          probe_file="$(mktemp)"
          probe_status="$(curl --silent --show-error \
            --request POST \
            --output "$probe_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $redis_token" \
            --header 'Content-Type: application/json' \
            --data '["PING"]' \
            "$redis_url")"
          if [ "$probe_status" != "200" ]; then
            echo "Upstash Redis PING failed with HTTP $probe_status" >&2
            rm -f "$probe_file"
            exit 1
          fi
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(x.result!=='PONG')process.exit(1)" "$probe_file"
          rm -f "$probe_file"
          unset redis_token
          echo "Upstash Redis relay probe passed."

      - name: Deploy source to production with remote Vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
