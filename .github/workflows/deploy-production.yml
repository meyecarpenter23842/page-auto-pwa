name: Deploy production

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deploy-production' &&
      github.event.issue.number == 1 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: page-auto-pwa-production
      cancel-in-progress: false
    env:
      VERCEL_TEAM_ID: team_964e6EsImAKgZe01NQmUNF7F
      VERCEL_PROJECT_NAME: page-auto-pwa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact main SHA
        id: exact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require green CI at exact SHA
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.EXACT_SHA,
              event: 'push',
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              run => run.status === 'completed' && run.conclusion === 'success',
            );
            if (!passed) core.setFailed(`No green ci.yml push run for ${process.env.EXACT_SHA}`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Resolve or create exact Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")"

          if [ "$status" = "404" ]; then
            create_file="$(mktemp)"
            create_status="$(curl --silent --show-error \
              --request POST \
              --output "$create_file" \
              --write-out '%{http_code}' \
              --url "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID" \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"name":"page-auto-pwa","framework":"vite","buildCommand":"npm run build","outputDirectory":"dist","skipGitConnectDuringLink":true}')"
            if [ "$create_status" != "200" ] && [ "$create_status" != "201" ]; then
              echo "Vercel project create failed with HTTP $create_status" >&2
              cat "$create_file" >&2
              exit 1
            fi
            response_file="$create_file"
          elif [ "$status" != "200" ]; then
            echo "Vercel project lookup failed with HTTP $status" >&2
            cat "$response_file" >&2
            exit 1
          fi

          project_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.id||'')" "$response_file")"
          project_name="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.name||'')" "$response_file")"
          account_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.accountId||'')" "$response_file")"

          test -n "$project_id"
          test "$project_name" = "$VERCEL_PROJECT_NAME"
          test "$account_id" = "$VERCEL_TEAM_ID"

          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$project_id" > .vercel/project.json
          echo "Linked exact Vercel project: $project_name ($project_id)"

      - name: Restore and verify private Blob relay store
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          stores_file="$(mktemp)"
          cleanup() { rm -f "$env_file" "$stores_file"; }
          trap cleanup EXIT

          npm install --no-save --ignore-scripts --no-audit --no-fund @vercel/blob@latest >/dev/null

          pull_production_env() {
            : > "$env_file"
            vercel env pull "$env_file" --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null
          }

          probe_blob_access() {
            unset BLOB_READ_WRITE_TOKEN || true
            set -a
            . "$env_file"
            set +a
            if [ -z "${BLOB_READ_WRITE_TOKEN:-}" ]; then
              return 1
            fi

            node --input-type=module <<'NODE'
          import { get } from '@vercel/blob'
          try {
            const result = await get('page-auto/relay/current.json', { access: 'private', useCache: false })
            if (result?.stream) await new Response(result.stream).arrayBuffer()
          } catch (error) {
            console.error(`Blob relay access probe failed: ${error instanceof Error ? error.name : 'unknown_error'}`)
            process.exit(1)
          }
          NODE
          }

          pull_production_env
          if ! probe_blob_access; then
            echo "Existing relay token is missing or invalid; restoring the token from the connected Blob store."
            project_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));process.stdout.write(x.projectId||'')")"
            test -n "$project_id"

            stores_status="$(curl --silent --show-error \
              --output "$stores_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/storage/stores?teamId=$VERCEL_TEAM_ID")"
            if [ "$stores_status" != "200" ]; then
              echo "Listing Vercel storage stores failed with HTTP $stores_status" >&2
              exit 1
            fi

            selected_store=""
            while IFS= read -r store_id; do
              [ -n "$store_id" ] || continue
              connection_file="$(mktemp)"
              connection_status="$(curl --silent --show-error \
                --output "$connection_file" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v1/storage/stores/$store_id/connections?teamId=$VERCEL_TEAM_ID")"
              if [ "$connection_status" = "200" ] && node - "$connection_file" "$project_id" <<'NODE'
          const fs = require('fs')
          const [file, projectId] = process.argv.slice(2)
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'))
          const connections = Array.isArray(payload.connections) ? payload.connections : []
          const ok = connections.some((entry) => entry.projectId === projectId && (!Array.isArray(entry.envVarEnvironments) || entry.envVarEnvironments.includes('production')))
          process.exit(ok ? 0 : 1)
          NODE
              then
                selected_store="$store_id"
                rm -f "$connection_file"
                break
              fi
              rm -f "$connection_file"
            done < <(node - "$stores_file" <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const stores = Array.isArray(payload.stores) ? payload.stores : []
          for (const store of stores) {
            if (store?.type === 'blob' && store?.access === 'private' && typeof store.id === 'string') console.log(store.id)
          }
          NODE
            )

            if [ -z "$selected_store" ]; then
              echo "No private Blob store connected to production for this project." >&2
              exit 1
            fi

            secrets_file="$(mktemp)"
            secrets_status="$(curl --silent --show-error \
              --output "$secrets_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/storage/stores/$selected_store/secrets?teamId=$VERCEL_TEAM_ID")"
            if [ "$secrets_status" != "200" ]; then
              echo "Reading Blob store secret failed with HTTP $secrets_status" >&2
              rm -f "$secrets_file"
              exit 1
            fi
            rw_token="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(x.rwToken||'')" "$secrets_file")"
            rm -f "$secrets_file"
            test -n "$rw_token"

            vercel env rm BLOB_READ_WRITE_TOKEN production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$rw_token" | vercel env add BLOB_READ_WRITE_TOKEN production --sensitive --yes --token="$VERCEL_TOKEN" >/dev/null
            unset rw_token
            pull_production_env
          fi

          if ! probe_blob_access; then
            echo "Private Blob relay store is still inaccessible after token restoration." >&2
            exit 1
          fi
          echo "Private Blob relay storage read probe passed."

      - name: Deploy source to production with remote Vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
