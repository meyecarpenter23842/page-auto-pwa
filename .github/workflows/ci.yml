name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reference preview diagnostic
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import base64, io
          image = Image.open('ui-tham-khao.jpg').convert('RGB')
          image.thumbnail((512, 342), Image.Resampling.LANCZOS)
          out = io.BytesIO()
          image.save(out, format='JPEG', quality=82, optimize=True)
          print('REF_PREVIEW_BASE64_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('REF_PREVIEW_BASE64_END')
          PY
      - name: Install dependencies
        run: npm install
      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit --pretty false
      - name: Typecheck Vite config
        run: npx tsc -p tsconfig.node.json --noEmit --pretty false
      - name: Typecheck relay API
        run: npx tsc -p tsconfig.api.json --noEmit --pretty false
      - name: Build
        run: npx vite build
