name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reference preview diagnostic
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('ui-tham-khao.jpg').convert('RGB')
          image.thumbnail((1024, 683), Image.Resampling.LANCZOS)
          image.save('/tmp/ui-reference-preview.jpg', format='JPEG', quality=90, optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ui-reference-preview
          path: /tmp/ui-reference-preview.jpg
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies
        run: npm install
      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit --pretty false
      - name: Typecheck Vite config
        run: npx tsc -p tsconfig.node.json --noEmit --pretty false
      - name: Typecheck relay API
        run: npx tsc -p tsconfig.api.json --noEmit --pretty false
      - name: Build
        run: npx vite build
